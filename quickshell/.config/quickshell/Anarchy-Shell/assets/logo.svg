<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Arch Linux "A" (nerdfonts nf-md-arch / MDI "arch", U+F06C7) fallback icon.
     Single-colour (#ffffff) on purpose: when shown via ColouredIcon, the
     Colouriser recolours it to the live pywal palette, so it tracks pywal
     without needing a static re-export on every wallpaper change. -->
<svg
   viewBox="0 0 128 128"
   version="1.1"
   width="128"
   height="128"
   xmlns="http://www.w3.org/2000/svg">
  <path
     d="M64,12 L18,116 L44,116 L64,66 L84,116 L110,116 Z"
     fill="#ffffff" />
</svg>
