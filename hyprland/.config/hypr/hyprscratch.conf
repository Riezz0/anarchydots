
# File Explorer
nautipad {
    class = org.gnome.Nautilus 
    command = nautilus 
}

# Terminal
termpad {
    class = termpad
    command = kitty --class=termpad 
}

# Neovim
vimpad {
    class = vimpad
    command = kitty --class=vimpad -e nvim 
}

# VSS Code
codepad {
    class = codepad
    command = code 
}

# Arabic Keyboard Layout
osdpad {
    class = ARKB
    #command = python ~/.config/xkb/symbols/ar.py
    command = qs -p ~/.config/quickshell/Anarchy-Bar/Q-Apps/KeyboardLayout
}

# Optional globals that apply to all scratchpads
daemon_options = clean
global_options = persist
